name: Sync remembering to claude-skills

# Source-of-truth for the `remembering` skill lives in this repo
# (oaustegard/muninn-utilities). claude-skills holds a deprecated mirror so
# the marketplace listing keeps working for anyone who installed it directly.
# This workflow pushes updates downstream to claude-skills as PRs.
#
# Required secret: SKILLS_PAT — a personal access token with `repo` scope on
# oaustegard/claude-skills. The default GITHUB_TOKEN can't open PRs in other
# repos.

on:
  push:
    branches: [main]
    paths:
      - 'remembering/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude-skills
        uses: actions/checkout@v4
        with:
          repository: oaustegard/claude-skills
          token: ${{ secrets.SKILLS_PAT }}
          path: claude-skills

      - name: Vendor latest remembering/ from this repo
        run: |
          rm -rf claude-skills/remembering
          mkdir -p claude-skills/remembering
          curl -sfL "https://codeload.github.com/oaustegard/muninn-utilities/tar.gz/main" \
            | tar -xz --strip-components=2 -C claude-skills/remembering \
              "muninn-utilities-main/remembering"
          echo "Vendored:"
          find claude-skills/remembering -type f | sort | head -20

      - name: Detect changes
        id: changes
        working-directory: claude-skills
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "remembering already in sync"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        working-directory: claude-skills
        env:
          GH_TOKEN: ${{ secrets.SKILLS_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/sync-remembering-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add remembering/
          git commit -m "chore: sync vendored remembering from muninn-utilities"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync vendored remembering from muninn-utilities" \
            --body "Automated sync of \`remembering/\` from [oaustegard/muninn-utilities](https://github.com/oaustegard/muninn-utilities/tree/main/remembering). Source-of-truth for the memory system has moved to muninn-utilities; this repo holds a deprecated mirror." \
            --base main \
            --head "$BRANCH"

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "remembering is already up to date in claude-skills"
