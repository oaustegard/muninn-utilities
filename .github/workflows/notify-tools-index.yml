name: Notify tools.json sync

# When manifests/ or the generator change on main, fire a repository_dispatch
# at muninn.austegard.com so its update-tools-index workflow rebuilds
# .well-known/tools.json promptly. The daily schedule there is the backstop;
# this is the prompt-sync path.
#
# Uses the secret MUNINN_SITE_DISPATCH_PAT — a classic PAT with `repo`
# scope on oaustegard/muninn.austegard.com. If the secret is ABSENT the step
# warns and skips (the site repo's daily scheduled rebuild is the backstop —
# only prompt-sync latency is lost). If the secret is PRESENT but the dispatch
# fails (expired/under-scoped PAT, API error), the step fails loudly — a
# silently-broken sync is the failure mode worth catching.
on:
  push:
    branches: ["main"]
    paths:
      - "manifests/**"
      - "scripts/build-tools-index.py"
      - ".github/workflows/notify-tools-index.yml"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch on muninn.austegard.com
        env:
          PAT: ${{ secrets.MUNINN_SITE_DISPATCH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::MUNINN_SITE_DISPATCH_PAT not set — skipping prompt-sync dispatch." >&2
            echo "The site repo's daily scheduled rebuild remains the backstop." >&2
            echo "To enable prompt sync, add a 'repo'-scoped classic PAT as MUNINN_SITE_DISPATCH_PAT." >&2
            exit 0
          fi
          curl -sS -f -X POST \
            -H "User-Agent: muninn-utilities-ci" \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/oaustegard/muninn.austegard.com/dispatches" \
            -d '{"event_type":"manifests-changed"}'
